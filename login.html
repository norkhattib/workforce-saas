<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#083526">
  <title>Workforce • Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-visual" aria-label="Workforce">
      <div class="auth-brandline">
        <div class="hero-mark">W</div>
        <div class="product-name">Workforce</div>
      </div>
      <h1 data-i18n="auth_hero_title">העסק שלך. מסודר יותר.</h1>
      <p data-i18n="app_tagline">ניהול עובדים, משמרות ושכר במקום אחד</p>
      <div class="auth-points">
        <div class="auth-point" data-i18n="auth_point_1">כל העובדים והמשמרות במקום אחד</div>
        <div class="auth-point" data-i18n="auth_point_2">שכר, מפרעות ודוחות בצורה ברורה</div>
        <div class="auth-point" data-i18n="auth_point_3">מערכת מאובטחת לכל עסק בנפרד</div>
      </div>
      <div class="language-switch" aria-label="Language">
        <button type="button" data-lang="he">עברית</button>
        <button type="button" data-lang="ar">العربية</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </section>

    <section class="auth-form-zone">
      <section class="auth-card">
        <div class="auth-card-top">
          <div class="mobile-brand">
            <div class="brand-mark">W</div>
            <strong>Workforce</strong>
          </div>
        </div>

       

        <div class="auth-kicker" data-i18n="welcome_back">ברוכים הבאים</div>
        <h2 data-i18n="login">התחברות</h2>
        <p class="auth-subtitle" data-i18n="login_subtitle">התחברו כדי להמשיך לניהול העסק שלכם.</p>

        <form id="loginForm">
          <label>
            <span data-i18n="email">אימייל</span>
            <input id="email" type="email" autocomplete="email" required>
          </label>
          <label>
            <span data-i18n="password">סיסמה</span>
            <input id="password" type="password" autocomplete="current-password" minlength="6" required>
          </label>
          <button class="primary-btn" id="submitBtn" type="submit" data-i18n="login">התחברות</button>
        </form>

        <p class="auth-link"><span data-i18n="no_account">אין לך חשבון?</span> <a href="register.html" data-i18n="register">הרשמה</a></p>
        <div class="auth-security-note" data-i18n="secure_login">חיבור מאובטח</div>
      </section>
    </section>
  </main>

<script>
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>i18n.setLanguage(b.dataset.lang));
auth.redirectIfLoggedIn();
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  appCommon.setButtonLoading(btn,true,i18n.t('signing_in'));
  try{
    const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});
    if(error) throw error;
    location.replace('dashboard.html');
  }catch(err){
    console.error(err);
    appCommon.toast(i18n.t('invalid_login'),'error');
    appCommon.setButtonLoading(btn,false);
  }
});
</script>
</body>
</html>
