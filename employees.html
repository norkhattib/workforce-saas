<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workforce • Employees</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/i18n.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script src="js/business.js"></script><script src="js/nav.js"></script></head><body class="app-page"><div data-app-nav></div><main class="app-main"><header class="page-header"><div><p class="eyebrow" data-i18n="employees"></p><h1 data-i18n="employees"></h1></div><div class="page-header-actions"><button class="primary-btn" id="addEmployeeBtn" data-i18n="add_employee"></button></div></header><section class="panel"><div class="toolbar"><input class="search" id="employeeSearch" data-i18n-placeholder="search_employees"><select class="filter-select" id="employeeStatus"><option value="all">All</option><option value="active" data-i18n="active"></option><option value="inactive" data-i18n="inactive"></option></select></div><div id="employeesTable"></div></section></main>
<div class="modal" id="employeeModal"><div class="modal-card"><div class="modal-head"><h2 id="employeeModalTitle" data-i18n="add_employee"></h2><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body"><form id="employeeForm"><input type="hidden" id="employeeId"><div class="form-grid"><label><span data-i18n="employee_name"></span><input id="employeeName" required></label><label><span data-i18n="phone"></span><input id="employeePhone" inputmode="tel"></label><label><span data-i18n="id_number"></span><input id="employeeIdNumber"></label><label><span data-i18n="email"></span><input id="employeeEmail" type="email"></label><label><span data-i18n="rate_before"></span><input id="employeeRateBefore" type="number" min="0" step="0.01"></label><label><span data-i18n="rate_after"></span><input id="employeeRateAfter" type="number" min="0" step="0.01"></label><label><span data-i18n="certificate_name"></span><input id="employeeCertName"></label><label><span data-i18n="certificate_expiry"></span><input id="employeeCertExpiry" type="date"></label><label class="full"><span data-i18n="notes"></span><textarea id="employeeNotes"></textarea></label></div><label class="form-check"><input id="employeeHasCert" type="checkbox"><span data-i18n="certificate"></span></label><label class="form-check"><input id="employeeActive" type="checkbox" checked><span data-i18n="active"></span></label><div class="modal-actions"><button type="button" class="btn" data-modal-close data-i18n="cancel"></button><button class="primary-btn" id="employeeSaveBtn" type="submit" data-i18n="save"></button></div></form></div></div></div><script src="js/employees.js"></script></body></html>
