<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workforce • Setup</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/i18n.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script src="js/business.js"></script>
</head><body class="onboarding-page"><main class="onboarding-shell"><div class="setup-brand"><div class="brand-mark">W</div><strong>Workforce</strong></div><section class="setup-card"><div class="step-pill">01</div><h1 data-i18n="onboarding_title"></h1><p data-i18n="onboarding_subtitle"></p><form id="businessForm"><label><span data-i18n="business_name"></span><input id="businessName" type="text" maxlength="120" required autofocus></label><div class="two-cols"><label><span data-i18n="default_language"></span><select id="language"><option value="he">עברית</option><option value="ar">العربية</option><option value="en">English</option></select></label><label><span data-i18n="currency"></span><select id="currency" disabled><option value="ILS">₪ ILS</option></select></label></div><button id="submitBtn" class="primary-btn" type="submit" data-i18n="create_business"></button></form></section></main>
<script>
(async()=>{const session=await auth.requireAuth();if(!session)return;const memberships=await businessApi.getMemberships();if(memberships.length){location.replace('dashboard.html');return;}language.value=i18n.getLanguage();language.onchange=()=>i18n.setLanguage(language.value);})();
businessForm.addEventListener('submit',async e=>{e.preventDefault();const btn=submitBtn;appCommon.setButtonLoading(btn,true,i18n.t('creating_business'));try{await businessApi.createBusiness(businessName.value.trim(),language.value);i18n.setLanguage(language.value);location.replace('dashboard.html');}catch(err){console.error(err);appCommon.toast(err.message||i18n.t('error_generic'),'error');appCommon.setButtonLoading(btn,false);}});
</script></body></html>
