<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workforce • Settings</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/i18n.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script src="js/business.js"></script><script src="js/nav.js"></script></head><body><div data-app-nav></div><main class="app-main"><header class="page-header"><div><p class="eyebrow" data-i18n="settings"></p><h1 data-i18n="settings"></h1></div></header><div class="settings-grid"><div class="settings-stack"><section class="panel" style="margin-top:0"><div class="panel-head"><h2 data-i18n="business_settings"></h2></div><form id="settingsForm"><div class="form-grid"><label class="field-card business-name-field"><span data-i18n="business_name"></span><div class="current-value-row"><small data-i18n="current_value"></small><strong id="settingsOriginalBusinessName">—</strong></div><input id="settingsBusinessName" autocomplete="organization"><small class="field-hint" data-i18n="business_name_hint"></small></label><label><span data-i18n="default_language"></span><select id="settingsLanguage"><option value="he">עברית</option><option value="ar">العربية</option><option value="en">English</option></select></label><label><span data-i18n="currency"></span><select id="settingsCurrency"><option value="ILS">₪ ILS</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option><option value="AED">د.إ AED</option></select></label><label><span data-i18n="overtime_threshold"></span><input id="settingsThreshold" type="number" min="0" step="0.25"></label><label><span data-i18n="salary_rounding"></span><input id="settingsRounding" type="number" min="0" step="1"></label></div><div class="checkbox-grid" style="margin-top:15px"><label class="checkbox-card"><input id="settingsCar" type="checkbox"><span data-i18n="allow_car_bonus"></span></label><label class="checkbox-card"><input id="settingsAdvances" type="checkbox"><span data-i18n="allow_advances"></span></label><label class="checkbox-card"><input id="settingsCompanyPayments" type="checkbox"><span data-i18n="allow_company_payments"></span></label></div><div class="modal-actions"><button id="settingsSaveBtn" class="primary-btn" data-i18n="save_settings"></button></div></form></section><section class="panel"><div class="panel-head"><h2 data-i18n="providers"></h2></div><form class="inline-form" id="providerForm"><input id="providerName" data-i18n-placeholder="provider_name" required><button class="primary-btn" data-i18n="add"></button></form><div class="mini-list" id="providersList"></div></section></div><div class="settings-stack"><section class="panel" style="margin-top:0"><div class="panel-head"><h2 data-i18n="clients"></h2></div><form class="inline-form" id="clientForm"><input id="clientName" data-i18n-placeholder="client_name" required><button class="primary-btn" data-i18n="add"></button></form><div class="mini-list" id="clientsList"></div></section><section class="panel"><div class="panel-head"><h2 data-i18n="locations"></h2></div><form class="inline-form three" id="locationForm"><input id="locationName" data-i18n-placeholder="location_name" required><select id="locationClient"><option value="">—</option></select><button class="primary-btn" data-i18n="add"></button></form><div class="mini-list" id="locationsList"></div></section></div></div></main><script src="js/settings.js"></script></body></html>
