<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workforce • Advances</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/i18n.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script src="js/business.js"></script><script src="js/nav.js"></script></head><body><div data-app-nav></div><main class="app-main"><header class="page-header"><div><p class="eyebrow" data-i18n="advances"></p><h1 data-i18n="advances"></h1></div><div class="page-header-actions"><button class="primary-btn" id="addAdvanceBtn" data-i18n="add_advance"></button></div></header><section class="stats-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px"><article class="stat-card"><span class="stat-icon">₪</span><strong id="advanceTotal">₪0</strong><small data-i18n="advances_total"></small></article><article class="stat-card"><span class="stat-icon">◎</span><strong id="advanceCount">0</strong><small data-i18n="advances"></small></article></section><section class="panel"><div class="toolbar"><input type="month" id="paymentMonth"><select id="paymentEmployee" class="filter-select"></select><select id="paymentProvider" class="filter-select"></select></div><div id="paymentsHost"></div></section></main>
<div class="modal" id="advanceModal"><div class="modal-card"><div class="modal-head"><h2 data-i18n="add_advance"></h2><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body"><form id="advanceForm"><div class="form-grid"><label><span data-i18n="employee"></span><select id="advanceEmployee" required></select></label><label><span data-i18n="provider"></span><select id="advanceProvider" required></select></label><label><span data-i18n="amount"></span><input id="advanceAmount" type="number" min="0.01" step="0.01" required></label><label><span data-i18n="payment_date"></span><input id="advanceDate" type="date" required></label><label class="full"><span data-i18n="reason"></span><textarea id="advanceReason"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" data-modal-close data-i18n="cancel"></button><button class="primary-btn" id="advanceSaveBtn" data-i18n="save"></button></div></form></div></div></div><script src="js/payments.js"></script></body></html>
