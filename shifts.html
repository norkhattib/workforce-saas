<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workforce • Shifts</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/i18n.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script src="js/business.js"></script><script src="js/nav.js"></script></head><body><div data-app-nav></div><main class="app-main"><header class="page-header"><div><p class="eyebrow" data-i18n="shifts"></p><h1 data-i18n="shifts"></h1></div><div class="page-header-actions"><button class="primary-btn" id="addShiftBtn" data-i18n="add_shift"></button></div></header><section class="panel"><div class="toolbar"><input class="search" id="shiftSearch" data-i18n-placeholder="search_shifts"><input type="month" id="shiftMonth"></div><div id="shiftsHost"></div></section></main>
<div class="modal" id="shiftModal"><div class="modal-card"><div class="modal-head"><h2 id="shiftModalTitle" data-i18n="add_shift"></h2><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body"><form id="shiftForm"><input type="hidden" id="shiftId"><div class="form-grid"><label><span data-i18n="date"></span><input id="shiftDate" type="date" required></label><label><span data-i18n="title"></span><input id="shiftTitle"></label><label><span data-i18n="client"></span><select id="shiftClient"></select></label><label><span data-i18n="location"></span><select id="shiftLocation"></select></label><label><span data-i18n="start_time"></span><input id="shiftStart" type="time"></label><label><span data-i18n="end_time"></span><input id="shiftEnd" type="time"></label><label><span data-i18n="status"></span><select id="shiftStatus"><option value="open" data-i18n="open"></option><option value="draft" data-i18n="draft"></option><option value="completed" data-i18n="completed"></option><option value="cancelled" data-i18n="cancelled"></option></select></label><label class="full"><span data-i18n="notes"></span><textarea id="shiftNotes"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" data-modal-close data-i18n="cancel"></button><button id="shiftSaveBtn" class="primary-btn" data-i18n="save"></button></div></form></div></div></div>
<div class="modal" id="manageShiftModal"><div class="modal-card wide"><div class="modal-head"><div><small class="muted" data-i18n="shift_details"></small><h2 id="manageShiftTitle"></h2></div><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body"><div class="inline-form"><select id="assignEmployee"></select><button class="primary-btn" id="assignEmployeeBtn" data-i18n="add_to_shift"></button></div><div id="assignedEmployees" class="shift-employee-list"></div></div></div></div><script src="js/shifts.js"></script></body></html>
